[package]
name = "jig"
version = "0.1.0"
description = "Jig - set-up sheet editor with PDF and HTML offline copies"
license = "GPL-3.0-or-later"
repository = "https://github.com/matthewjaybarr-png/jig"
edition = "2021"

[lib]
name = "jig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
